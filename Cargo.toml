[package]
name = "crawssembly"
version = "1.2.0"
edition = "2024"
description = "An educational assembly-like language and virtual machine."
license = "MIT"
repository = "https://github.com/Jonah-Crawford/Crawssembly"
readme = "README.md"
keywords = ["assembly", "education", "language", "virtual-machine"]
categories = ["compilers", "emulators"]

include = [
  "/src/**/*.rs",
  "/examples/**/*.craw",
  "/README.md",
  "/LICENSE",
  "/Cargo.toml"
]

[features]
default = ["native"]
native = ["cpal", "crossterm", "ctrlc", "sysinfo", "chrono"]
wasm = ["wasm-bindgen"]

[dependencies]
dirs = "6.0.0"
wasm-bindgen = { version = "0.2", optional = true }
cpal = { version = "0.15", optional = true }
crossterm = { version = "0.28", optional = true }
ctrlc = { version = "3.5", optional = true }
sysinfo = { version = "0.37", optional = true }
chrono = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
ureq = "2"
serde_json = "1"
rpassword = "7"

[profile.release]
debug = false

[[bin]]
name = "craw"
path = "src/main.rs"
required-features = ["native"]

[lib]
crate-type = ["cdylib", "rlib"]
